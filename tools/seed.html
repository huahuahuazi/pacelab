<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8" /><title>种子数据</title></head>
<body style="background:#111;color:#0f0;font:13px monospace;padding:16px">
<pre id="out">seeding...</pre>
<script type="module">
import { generatePlan } from '../js/plan.js';

/**
 * 给截图脚本用的样本数据。
 *
 * 为什么不用真实用户数据：截图要能公开展示，而真实记录里有日期、配速、
 * 心率这些能反推身份的信息。这里全部是构造的，但刻意做成**真实的样子**。
 *
 * 关键约束：配速、心率、VDOT 三者必须自洽。VDOT 33 的人，
 * 7'00" 的轻松跑心率约 140，5'40" 的比赛配速心率会到 178。
 * 乱造数据会让体能画像算出「心率效率 100」这种一眼假的结论。
 */
const state = {
  version: 1,
  profile: { nickname: '跑者', weightKg: 68, age: 32, restingHR: 58, maxHR: null },
  runs: [
    { id: 'r1', date: '2026-11-12', distanceKm: 6.0, durationSec: 2520, avgHr: 142, cadence: 172, strideCm: 104, note: '轻松跑，状态不错', source: 'manual', createdAt: '2026-11-12T10:00:00Z' },
    { id: 'r2', date: '2026-11-10', distanceKm: 8.0, durationSec: 3440, avgHr: 140, cadence: 168, strideCm: 106, note: '', source: 'image', createdAt: '2026-11-10T10:00:00Z' },
    { id: 'r3', date: '2026-11-08', distanceKm: 5.0, durationSec: 1700, avgHr: 178, cadence: 180, strideCm: 116, note: '5K 测试，拼了一把', source: 'manual', createdAt: '2026-11-08T10:00:00Z' },
    { id: 'r4', date: '2026-11-05', distanceKm: 8.0, durationSec: 2880, avgHr: 168, cadence: 174, strideCm: 111, note: '节奏跑，最后 2km 有点撑', source: 'manual', createdAt: '2026-11-05T10:00:00Z' },
    { id: 'r5', date: '2026-11-03', distanceKm: 7.0, durationSec: 3010, avgHr: 143, cadence: 167, strideCm: 105, note: '', source: 'manual', createdAt: '2026-11-03T10:00:00Z' },
    { id: 'r6', date: '2026-10-30', distanceKm: 5.0, durationSec: 2150, avgHr: 141, cadence: 170, strideCm: 102, note: '', source: 'manual', createdAt: '2026-10-30T10:00:00Z' },
    { id: 'r7', date: '2026-10-27', distanceKm: 9.0, durationSec: 3870, avgHr: 145, cadence: 166, strideCm: 106, note: '', source: 'manual', createdAt: '2026-10-27T10:00:00Z' },
    { id: 'r8', date: '2026-10-24', distanceKm: 12.0, durationSec: 5280, avgHr: 148, cadence: 165, strideCm: 105, note: '长距离，最后 2km 掉速', source: 'manual', createdAt: '2026-10-24T10:00:00Z' },
    { id: 'r9', date: '2026-10-21', distanceKm: 6.5, durationSec: 2730, avgHr: 141, cadence: 171, strideCm: 103, note: '', source: 'manual', createdAt: '2026-10-21T10:00:00Z' },
  ],
  plans: [],
  activePlanId: null,
};

try {
  // 顺手生成一个真实计划，这样计划页截图才有东西可看。
  // 用 generatePlan 而不是手写 JSON：手写的结构一旦和生成器脱节，
  // 截图好看但页面实际会崩。
  const plan = generatePlan({
    targetEv: '5K',
    vdot: 27.2,
    baseWeekKm: 20,
    daysPerWeek: 4,
    startDate: '2026-11-16',
  });
  // 前三天标成已完成，看进度条和"已完成"标记的实际样子
  plan.days[1].done = true;
  plan.days[1].runId = 'r1';
  plan.days[3].done = true;
  plan.days[3].runId = 'r2';
  state.plans = [plan];
  state.activePlanId = plan.id;

  localStorage.setItem('pacelab.state.v1', JSON.stringify(state));
  document.getElementById('out').textContent =
    'OK: ' + state.runs.length + ' runs + plan ' + plan.weeks + 'w/' + plan.daysPerWeek + 'd';
} catch (e) {
  document.getElementById('out').textContent = 'FAIL: ' + e.message;
}
</script>
</body>
</html>
